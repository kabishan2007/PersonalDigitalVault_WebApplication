<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Personal Digital Vault</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-hero">
      <div class="mark">
        <img src="/images/logo.png" alt="Vault logo" />
        <strong>Personal Digital Vault</strong>
      </div>
      <h1>Unlock your vault.</h1>
      <p>Secure access to documents, folders, and saved credentials.</p>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <h2>Login</h2>
        <p class="lede">Enter your email and password to continue.</p>
        <div id="authAlert" class="alert"></div>
        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="you@email.com" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required placeholder="••••••••" />
          </div>
          <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
        <div class="auth-switch">
          No account? <a href="/register.html">Register</a>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
