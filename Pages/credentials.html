<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credentials · Personal Digital Vault</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/credential.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/images/logo.png" alt="Logo" />
        <span>Personal Digital Vault</span>
      </div>
      <nav class="nav-links">
        <a href="/dashboard.html" data-nav="dashboard">Dashboard</a>
        <a href="/folders.html" data-nav="folders">Folders</a>
        <a href="/documents.html" data-nav="documents">Documents</a>
        <a href="/credentials.html" data-nav="credentials">Credentials</a>
        <a href="/profile.html" data-nav="profile">Profile</a>
        <a href="/admin-dashboard.html" data-nav="admin" id="adminNav" style="display:none">Admin</a>
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <img src="/images/user.png" alt="User" />
          <div>
            <strong id="shellUserName">User</strong>
            <small id="shellUserRole">Role</small>
          </div>
        </div>
        <button class="btn btn-ghost" id="logoutBtn" type="button">Logout</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>Credentials</h1>
          <p>Save site usernames and passwords securely.</p>
        </div>
      </div>

      <section class="panel">
        <div id="credentialAlert" class="alert"></div>
        <form id="credentialForm" class="cred-form">
          <div class="field">
            <label for="siteName">Site name</label>
            <input id="siteName" name="siteName" type="text" required placeholder="Gmail" />
          </div>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="text" required />
          </div>
          <button class="btn btn-primary" type="submit">Add</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Saved credentials</h2></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Site</th>
                <th>Username</th>
                <th>Password</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="credentialTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="editModal">
    <div class="modal">
      <h3>Edit credential</h3>
      <form id="editCredentialForm">
        <div class="field">
          <label for="editSite">Site name</label>
          <input id="editSite" name="siteName" type="text" required />
        </div>
        <div class="field">
          <label for="editUser">Username</label>
          <input id="editUser" name="username" type="text" required />
        </div>
        <div class="field">
          <label for="editPass">Password</label>
          <input id="editPass" name="password" type="text" required />
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" type="button" id="closeModal">Cancel</button>
          <button class="btn btn-primary" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/credential.js"></script>
</body>
</html>
