<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Personal Digital Vault</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
    <style>
        .btn btn-ghost{
            background-color:white;
        }
    </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/images/logo.png" alt="Logo" />
        <span>Personal Digital Vault</span>
      </div>
      <nav class="nav-links">
        <a href="/dashboard.html" data-nav="dashboard">Dashboard</a>
        <a href="/folders.html" data-nav="folders">Folders</a>
        <a href="/documents.html" data-nav="documents">Documents</a>
        <a href="/credentials.html" data-nav="credentials">Credentials</a>
        <a href="/profile.html" data-nav="profile">Profile</a>
        <a href="/admin-dashboard.html" data-nav="admin" id="adminNav">Admin</a>
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <img src="/images/user.png" alt="User" />
          <div>
            <strong id="shellUserName">User</strong>
            <small id="shellUserRole">Role</small>
          </div>
        </div>
        <button class="btn btn-ghost" id="logoutBtn" type="button">Logout</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>Admin dashboard</h1>
          <p>System totals and registered users.</p>
        </div>
      </div>

      <div id="adminAlert" class="alert"></div>
      <div class="admin-note">Visible only for users with the Admin role.</div>

      <div class="stats">
        <div class="stat"><span>Total users</span><strong id="statUsers">0</strong></div>
        <div class="stat"><span>Folders</span><strong id="statFolders">0</strong></div>
        <div class="stat"><span>Documents</span><strong id="statDocuments">0</strong></div>
        <div class="stat"><span>Credentials</span><strong id="statCredentials">0</strong></div>
      </div>

      <section class="panel">
        <div class="panel-head"><h2>Users</h2></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
