<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Digital Vault</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-hero">
      <div class="mark">
        <img src="/images/logo.png" alt="Vault logo" />
        <strong>Personal Digital Vault</strong>
      </div>
      <h1>Your private space for digital life.</h1>
      <p>Store folders, files, and credentials in one calm, secure vault.</p>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <h2>Welcome</h2>
        <p class="lede">Sign in to open your vault, or create a new account.</p>
        <a class="btn btn-primary" href="/login.html">Login</a>
        <div class="auth-switch">
          New here? <a href="/register.html">Create account</a>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
