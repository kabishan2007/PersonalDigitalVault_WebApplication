<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · Personal Digital Vault</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/images/logo.png" alt="Logo" />
        <span>Personal Digital Vault</span>
      </div>
      <nav class="nav-links">
        <a href="/dashboard.html" data-nav="dashboard">Dashboard</a>
        <a href="/folders.html" data-nav="folders">Folders</a>
        <a href="/documents.html" data-nav="documents">Documents</a>
        <a href="/credentials.html" data-nav="credentials">Credentials</a>
        <a href="/profile.html" data-nav="profile">Profile</a>
        <a href="/admin-dashboard.html" data-nav="admin" id="adminNav" style="display:none">Admin</a>
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <img src="/images/user.png" alt="User" />
          <div>
            <strong id="shellUserName">User</strong>
            <small id="shellUserRole">Role</small>
          </div>
        </div>
        <button class="btn btn-ghost" id="logoutBtn" type="button">Logout</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>Profile</h1>
          <p>Update your name and email.</p>
        </div>
      </div>

      <section class="panel" style="max-width:560px">
        <div id="profileAlert" class="alert"></div>
        <form id="profileForm">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>
          <div class="field">
            <label for="role">Role</label>
            <input id="role" name="role" type="text" readonly />
          </div>
          <button class="btn btn-primary" type="submit">Save changes</button>
        </form>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
