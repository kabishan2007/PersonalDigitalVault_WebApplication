<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documents · Personal Digital Vault</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/document.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/images/logo.png" alt="Logo" />
        <span>Personal Digital Vault</span>
      </div>
      <nav class="nav-links">
        <a href="/dashboard.html" data-nav="dashboard">Dashboard</a>
        <a href="/folders.html" data-nav="folders">Folders</a>
        <a href="/documents.html" data-nav="documents">Documents</a>
        <a href="/credentials.html" data-nav="credentials">Credentials</a>
        <a href="/profile.html" data-nav="profile">Profile</a>
        <a href="/admin-dashboard.html" data-nav="admin" id="adminNav" style="display:none">Admin</a>
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <img src="/images/user.png" alt="User" />
          <div>
            <strong id="shellUserName">User</strong>
            <small id="shellUserRole">Role</small>
          </div>
        </div>
        <button class="btn btn-ghost" id="logoutBtn" type="button">Logout</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1>Documents</h1>
          <p>Upload files into a folder and download anytime.</p>
        </div>
      </div>

      <section class="panel">
        <div id="documentAlert" class="alert"></div>
        <form id="uploadForm" class="upload-form">
          <div class="field">
            <label for="folderId">Folder</label>
            <select id="folderId" name="folderId" required></select>
          </div>
          <div class="field">
            <label for="file">File</label>
            <input id="file" name="file" type="file" required />
          </div>
          <button class="btn btn-primary" type="submit">Upload</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>All documents</h2>
          <div class="field" style="margin:0; min-width:200px">
            <label for="filterFolder">Filter by folder</label>
            <select id="filterFolder"></select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>File</th>
                <th>Folder</th>
                <th>Hash</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="documentTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/document.js"></script>
</body>
</html>
