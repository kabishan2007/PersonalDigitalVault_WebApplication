<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · Personal Digital Vault</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-hero">
      <div class="mark">
        <img src="/images/logo.png" alt="Vault logo" />
        <strong>Personal Digital Vault</strong>
      </div>
      <h1>Create your vault.</h1>
      <p>One account for folders, files, and encrypted credentials.</p>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <h2>Register</h2>
        <p class="lede">Fill in your details to get started.</p>
        <div id="authAlert" class="alert"></div>
        <form id="registerForm">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required placeholder="Your name" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required placeholder="you@email.com" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6" placeholder="At least 6 characters" />
          </div>
          <button class="btn btn-primary" type="submit">Create account</button>
        </form>
        <div class="auth-switch">
          Already registered? <a href="/login.html">Login</a>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
